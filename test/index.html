
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <img src="Logo.svg" class="logo" alt="Logo">
        <nav>
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <a href="#">Support</a>
        </nav>

        <button class="signup">Sign Up</button>
    </header>

    <section class="hero">

        <div class="hero-content">
            <h1>Make Your Home<br>
                More Beautiful</h1>

            <ul>
                <li>High Quality Material</li>
                <li>Lifetime Service Guarantee</li>
                <li>Designed by World Class Designers</li>
            </ul>

            <button>Explore Shop</button>
        </div>

        <div class="hero-image">
              <img src="Image.svg" alt="Image">
              <img src="Image (1).svg" alt="Image">
        </div>
    </section>
<section class="signature-section">
    <h2 class="signature-title">Signature Items</h2>
    
    <div class="signature-container">
       
        <div class="item-card">
            <div class="image-wrapper">
                <img src="chair1.svg" alt="">
            </div>
            <div class="card-info">
                <h3>Lyon Chair</h3>
                <p>Wood</p>
                <button class="add-btn">+</button>
            </div>
        </div>

        
        <div class="item-card">
            <div class="image-wrapper">
                <img src="chair2.svg" alt="Arm Chair"> 
            </div>
            <div class="card-info">
                <h3>Arm Chair</h3>
                <p>Wood</p>
                <button class="add-btn">+</button>
            </div>
        </div>

       
        <div class="item-card">
            <div class="image-wrapper">
                <img src="chair3.svg" alt="Chesterfield Chair"> 
            </div>
            <div class="card-info">
                <h3>Chesterfield Chair</h3>
                <p>Wood</p>
                <button class="add-btn">+</button>
            </div>
        </div>

        
        <div class="item-card">
            <div class="image-wrapper">
                <img src="chair4.svg" alt="Chloe Chair"> <!-- Укажите правильное имя вашей картинки -->
            </div>
            <div class="card-info">
                <h3>Chloe Chair</h3>
                <p>Wood</p>
                <button class="add-btn">+</button>
            </div>
        </div>
    </div>

    <div class="explore-all-container">
        <button class="explore-all-btn">Explore All Items</button>
    </div>
</section>




















</body>
</html>
